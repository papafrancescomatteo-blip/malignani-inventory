services:
  - type: web
    name: malignani-inventory-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: metrologia
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: malignani-inventory-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
      - key: ENABLE_HEALTH_CHECK
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
